<aside class="hidden w-80 shrink-0 border-l border-slate-200/70 bg-white/72 p-6 backdrop-blur 2xl:block">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">Today</p>
      <h2 class="mt-1 text-2xl font-extrabold text-slate-900">Agenda</h2>
    </div>
    <div class="rounded-2xl bg-slate-100 px-3 py-2 text-sm font-semibold text-slate-600">
      {{ events.length }}
    </div>
  </div>

  <div *ngIf="events.length > 0; else emptyState" class="mt-6 space-y-4">
    <article *ngFor="let event of events" class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="flex items-start justify-between gap-3">
        <div>
          <span
            class="app-badge"
            [ngClass]="event.itemType === 'task' ? 'bg-blue-100 text-blue-700' : 'bg-violet-100 text-violet-700'"
          >
            {{ event.itemType === 'task' ? 'Task' : 'Event' }}
          </span>
          <h3 class="mt-3 text-base font-bold text-slate-900">{{ event.title }}</h3>
        </div>
        <div class="rounded-2xl bg-slate-50 px-3 py-2 text-right">
          <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-slate-400">Time</p>
          <p class="mt-1 text-sm font-bold text-slate-700">{{ event.date | date:'HH:mm' }}</p>
        </div>
      </div>

      <p *ngIf="event.description" class="mt-3 text-sm text-slate-500">{{ event.description }}</p>
    </article>
  </div>

  <ng-template #emptyState>
    <div class="mt-6 rounded-3xl border border-dashed border-slate-300 bg-slate-50 p-6 text-center">
      <p class="text-sm font-semibold uppercase tracking-[0.18em] text-slate-400">No items</p>
      <p class="mt-2 text-sm text-slate-500">Your day is still open. Add a task or event to start planning.</p>
    </div>
  </ng-template>
</aside>
