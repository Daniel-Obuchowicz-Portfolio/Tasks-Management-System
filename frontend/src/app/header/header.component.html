<aside class="app-sidebar">
  <div class="app-sidebar__brand">
    <div class="app-sidebar__logo">TM</div>
    <div>
      <p class="app-sidebar__eyebrow">Workspace</p>
      <h1>TaskFlow</h1>
    </div>
  </div>

  <div class="app-sidebar__profile app-surface">
    <div class="app-sidebar__avatar">
      {{ (username || 'G').slice(0, 1).toUpperCase() }}
    </div>
    <div>
      <p class="app-sidebar__name">{{ username }}</p>
      <p class="app-sidebar__role">{{ title }}</p>
    </div>
  </div>

  <nav class="app-sidebar__nav">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="is-active"
      class="app-sidebar__link"
    >
      <i [class]="item.icon"></i>
      <span>{{ item.label | translate }}</span>
    </a>
  </nav>

  <div class="app-sidebar__footer app-surface">
    <div class="app-sidebar__footer-row">
      <span class="app-sidebar__footer-label">Language</span>
      <select [(ngModel)]="selectedLanguage" (change)="changeLanguage(selectedLanguage)">
        <option value="en">EN</option>
        <option value="pl">PL</option>
      </select>
    </div>

    <button class="app-button app-button-primary w-full" (click)="onLogout()">
      <i class="fas fa-arrow-right-from-bracket"></i>
      <span>Logout</span>
    </button>
  </div>
</aside>
